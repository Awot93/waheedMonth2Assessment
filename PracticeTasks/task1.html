<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .card{
    box-sizing: border-box;
    border: 2px solid;
    position: relative;
    width: 530px;
    margin: 60px auto;
    padding: 90px;
    background-color: white;
    border-radius: 14px;
}
.heading{
    top: -40px;
    padding: 20px 20px;
    border-radius: 13px;
    border: 2px solid;
    position: absolute;
    width: 50%;
    background-color: rgb(243, 36, 164);
    text-align: center;

}
</style>
</head>


<body>
   <div class="card">
    <div class="heading">
        <h1>An Otter Essay</h1>
    </div>
    <p>Otters have long, slim bodies and relatively short limbs. 
        Their most striking anatomical features are the powerful webbed feet used to swim, and their seal-like 
        abilities holding breath underwater.
    </p>    

   </div> 
</body>
</html>
